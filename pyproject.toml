[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Membuat video otomatis dari narasi audio, media berurutan, dan transcript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.2.1",
  "av>=14.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.gui-scripts]
autoedit = "autoedit.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
